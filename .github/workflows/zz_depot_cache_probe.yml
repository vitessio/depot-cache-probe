name: Depot cache probe

# Temporary. Checks whether a pull request from a fork, running on a Depot
# runner, can save a cache entry that a trusted run (a push to a branch of the
# base repository) then restores. Saves and restores a harmless marker file.
on:
  pull_request:
  push:
    branches:
      - "arthur/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Describe the run
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          echo "event=${EVENT} ref=${REF} head_repo=${HEAD_REPO} fork=${IS_FORK}"
          echo "runner=${RUNNER_NAME} environment=${RUNNER_ENVIRONMENT}"
          # Host names only, never the tokens.
          for v in ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_CACHE_SERVICE_V2; do
            val="${!v:-}"
            echo "${v}=$(sed -E 's#^(https?://[^/]+).*#\1#' <<<"${val}")"
          done
          # The cache scopes GitHub grants this run ("ac" claim; Permission 1 = read,
          # 2 = write). The payload holds no secret; the signature is not printed.
          p="$(cut -d. -f2 <<<"${ACTIONS_RUNTIME_TOKEN:-}" | tr '_-' '/+')"
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="${p}="; done
          base64 -d <<<"${p}" | jq -r '.ac // "no ac claim"' || echo "could not decode the runtime token"

      - name: Restore any probe entry (by prefix)
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: depot-cache-probe-none
          restore-keys: depot-cache-probe-

      - name: Show what was restored
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          echo "matched key: ${MATCHED:-<none>}"
          cat probe/marker 2>/dev/null || echo "no marker restored"

      # Exact keys, so that restore order plays no part: one entry saved by a
      # push to a branch of this repository, one saved by the fork pull request.
      # Each restores into probe/, the path it was saved from (the path is part
      # of the cache version), after clearing what the step before restored.
      - name: Clear probe/
        run: rm -rf probe

      - name: Restore the base repository's entry (exact key)
        id: base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: depot-cache-probe-40949933294

      - name: Show the base result
        env:
          HIT: ${{ steps.base.outputs.cache-hit }}
        run: |
          echo "base entry hit=${HIT:-false}: $(cat probe/marker 2>/dev/null || echo none)"
          rm -rf probe

      - name: Restore the fork pull request's entry (exact key)
        id: fork
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: depot-cache-probe-40946332371

      - name: Show the fork result
        env:
          HIT: ${{ steps.fork.outputs.cache-hit }}
        run: |
          echo "fork entry hit=${HIT:-false}: $(cat probe/marker 2>/dev/null || echo none)"
          rm -rf probe

      - name: Write the marker
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/arthur/probe-save'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          mkdir -p probe
          echo "saved by ${GITHUB_EVENT_NAME} from ${HEAD_REPO:-${GITHUB_REPOSITORY}} at ${GITHUB_REF}, run ${GITHUB_RUN_ID}" > probe/marker

      - name: Save the marker
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/arthur/probe-save'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: depot-cache-probe-${{ github.run_id }}

  # Depot runners pre-set GOCACHEPROG, so go reads and writes Depot's Go cache
  # directly. A compile that `go build -x` does not run came from that cache.
  gocache:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Describe the Go cache
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          echo "event=${EVENT} ref=${REF} fork=${IS_FORK}"
          go version
          # The program and its arguments, with anything token-like redacted.
          go env GOCACHEPROG | sed -E 's/[A-Za-z0-9_.-]{24,}/<redacted>/g'
          for v in DEPOT_TOKEN DEPOT_CACHE_TOKEN; do echo "${v} set: $([ -n "${!v:-}" ] && echo yes || echo no)"; done

      - name: Build the packages
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "${EVENT}:${REF}" in
          push:refs/heads/arthur/gc-base-1) pkgs="basepkg" ;;
          pull_request:*) pkgs="basepkg forkpkg" ;;
          *) pkgs="basepkg forkpkg" ;;
          esac
          for p in ${pkgs}; do
            if go build -trimpath -x "./${p}" 2>&1 | grep -q -- "-p example.com/probe/${p} "; then
              echo "${p}: compiled here (cache miss)"
            else
              echo "${p}: from the cache (cache hit)"
            fi
          done
